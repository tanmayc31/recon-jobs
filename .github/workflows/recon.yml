name: recon

# Lanes (each its own job with its own 15-minute limit; steps live in recon-lane.yml).
# cron-job.org triggers them through workflow_dispatch (GitHub's own cron is unreliable):
#   1-2        Tier 1-2, all ATSes                  every 30 min
#   3-other    Tier 3 Greenhouse/Lever/Ashby        every 3 h
#   3-workday  Tier 3 Workday                       every 6 h
# Weekly recheck (Sunday 11pm ET, GitHub cron): all three lanes with --recheck, so new
# filter rules reach old jobs. Daily open check (GitHub cron): gone jobs leave New/Backlog/Later.
# AI judge: after each normal 1-2 run, scores up to 48 unjudged matches from any lane,
# 6 per Gemini request.
on:
  schedule:
    - cron: "0 4 * * 1"      # weekly recheck: Monday 04:00 UTC = Sunday night US
    - cron: "0 10 * * *"     # daily open check: 10:00 UTC = early morning US
  workflow_dispatch:          # cron-job.org and the manual "Run workflow" button
    inputs:
      lane:
        description: "What to check"
        type: choice
        options: ["1-2", "3-other", "3-workday", "add"]
        default: "1-2"
      recheck:
        description: "Re-judge known jobs (after changing filter rules)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tier-1-2:
    if: github.event.schedule == '0 4 * * 1' || inputs.lane == '1-2'
    uses: ./.github/workflows/recon-lane.yml
    with:
      lane: "1-2"
      args: "--tiers 1,2"
      browser: true
      recheck: ${{ github.event.schedule == '0 4 * * 1' || inputs.recheck == true }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  tier-3-other:
    if: github.event.schedule == '0 4 * * 1' || inputs.lane == '3-other'
    uses: ./.github/workflows/recon-lane.yml
    with:
      lane: "3-other"
      args: "--tiers 3 --ats greenhouse,lever,ashby"
      recheck: ${{ github.event.schedule == '0 4 * * 1' || inputs.recheck == true }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  tier-3-workday:
    if: github.event.schedule == '0 4 * * 1' || inputs.lane == '3-workday'
    uses: ./.github/workflows/recon-lane.yml
    with:
      lane: "3-workday"
      args: "--tiers 3 --ats workday"
      recheck: ${{ github.event.schedule == '0 4 * * 1' || inputs.recheck == true }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  open-check:
    # daily: every job in New, Backlog and Later is checked through its site's API (Workday detail,
    # Greenhouse/Lever job, Ashby board, amazon.jobs page), job-list jobs on company sites in a
    # browser; the gone ones are closed
    if: github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Browser for job-list jobs on company sites
        run: pip install playwright==1.65.1 && python -m playwright install --with-deps chromium
      - name: Close gone jobs (counts only; logs are public)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CI: "true"
        run: python -m recon.linkcheck --recheck-open

  add:
    # jobs pasted into the dashboard's "Add job" box: the dashboard starts lane "add" right away;
    # every 1-2 run also handles any still queued
    if: ${{ inputs.lane == 'add' || (inputs.lane == '1-2' && !inputs.recheck) }}
    concurrency:
      group: recon-add
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Browser for company pages
        if: inputs.lane == 'add'
        run: pip install playwright==1.65.1 && python -m playwright install --with-deps chromium
      - name: Add jobs (counts only; logs are public)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CI: "true"
        run: python -m recon.add

  judge:
    needs: tier-1-2
    # still judge when the fetch failed (the queue is in the database); never on rechecks
    if: ${{ !cancelled() && inputs.lane == '1-2' && !inputs.recheck }}
    concurrency:
      group: recon-judge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 40 jobs x 13s pacing is about 9 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: AI judge (counts only; logs are public)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
        run: python -m recon.judge
