name: recon

# Lanes (each its own job with its own 15-minute limit; steps live in recon-lane.yml).
# cron-job.org triggers them through workflow_dispatch (GitHub's own cron is unreliable):
#   1-2        Tier 1-2, all ATSes                  every 30 min
#   3-other    Tier 3 Greenhouse/Lever/Ashby        every 3 h
#   3-workday  Tier 3 Workday                       every 3 h (~350 of 635 companies a run,
#                                                    longest-waiting first: each every ~6 h)
# Timed chores ride on those lanes (recon/chores.py; GitHub's own schedule ran hours late or not at
# all). The gate job asks which are due by the clock and claims them in the database, so each runs
# once whichever trigger comes first:
#   weekly recheck   Monday from 04:00 UTC (Sunday night US): each lane's next run uses --recheck,
#                    so new filter rules reach old jobs; Workday again from 08:00 (one run reaches
#                    part of its companies; rotation starts the second with the ones it missed)
#   open check       daily from 10:00 UTC, the 1-2 lane: gone jobs leave New/Backlog/Later
#   best open check  every 3 hours, the 1-2 lane: Best bets and New, so a dead job leaves before you click it
# GitHub's schedule below is only a backup: it runs the same gate, which finds the chores claimed.
# AI judge: after each normal 1-2 run, scores up to 48 unjudged matches from any lane,
# 6 per Gemini request.
on:
  schedule:
    # backup only: the gate does nothing if the lanes already ran these chores
    - cron: "15 4 * * 1"     # weekly recheck
    - cron: "15 8 * * 1"     # weekly recheck, Workday's second pass
    - cron: "15 10 * * *"    # daily open check
    - cron: "45 */3 * * *"   # Best bets and New open check
  workflow_dispatch:          # cron-job.org and the manual "Run workflow" button
    inputs:
      lane:
        description: "What to check"
        type: choice
        options: ["1-2", "3-other", "3-workday", "add"]
        default: "1-2"
      recheck:
        description: "Re-judge known jobs (after changing filter rules)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    # which timed chores this run does (prints only true/false); if it fails, lanes still run as usual
    if: github.event_name == 'schedule' || contains(fromJSON('["1-2", "3-other", "3-workday"]'), inputs.lane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      recheck_12: ${{ steps.due.outputs.recheck_12 }}
      recheck_other: ${{ steps.due.outputs.recheck_other }}
      recheck_workday: ${{ steps.due.outputs.recheck_workday }}
      open_check: ${{ steps.due.outputs.open_check }}
      open_check_best: ${{ steps.due.outputs.open_check_best }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: due
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LANE: ${{ inputs.lane || 'all' }}
        run: python -m recon.chores --lane "$LANE" | tee -a "$GITHUB_OUTPUT"

  tier-1-2:
    needs: gate
    if: ${{ !cancelled() && (inputs.lane == '1-2' || needs.gate.outputs.recheck_12 == 'true') }}
    uses: ./.github/workflows/recon-lane.yml
    with:
      lane: "1-2"
      args: "--tiers 1,2"
      browser: true
      recheck: ${{ inputs.recheck == true || needs.gate.outputs.recheck_12 == 'true' }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      JOBRIGHT_SENDER: ${{ secrets.JOBRIGHT_SENDER }}

  tier-3-other:
    needs: gate
    if: ${{ !cancelled() && (inputs.lane == '3-other' || needs.gate.outputs.recheck_other == 'true') }}
    uses: ./.github/workflows/recon-lane.yml
    with:
      lane: "3-other"
      args: "--tiers 3 --ats greenhouse,lever,ashby"
      recheck: ${{ inputs.recheck == true || needs.gate.outputs.recheck_other == 'true' }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  tier-3-workday:
    needs: gate
    if: ${{ !cancelled() && (inputs.lane == '3-workday' || needs.gate.outputs.recheck_workday == 'true') }}
    uses: ./.github/workflows/recon-lane.yml
    with:
      lane: "3-workday"
      args: "--tiers 3 --ats workday"
      recheck: ${{ inputs.recheck == true || needs.gate.outputs.recheck_workday == 'true' }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  open-check:
    # daily: every job in New, Backlog and Later is checked through its site's API (Workday detail,
    # Greenhouse/Lever job, Ashby board, amazon.jobs page), job-list jobs on company sites in a
    # browser; the gone ones are closed
    needs: gate
    if: needs.gate.outputs.open_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Browser for job-list jobs on company sites
        run: pip install playwright==1.65.1 && python -m playwright install --with-deps chromium
      - name: Close gone jobs (counts only; logs are public)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECON_PERSONAL_LISTS: ${{ vars.RECON_PERSONAL_LISTS }}
          CI: "true"
        run: python -m recon.linkcheck --recheck-open

  open-check-best:
    # every 3 hours: the jobs you open first (Best bets, New), same checks as the daily one
    needs: gate
    if: needs.gate.outputs.open_check_best == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Browser for job-list jobs on company sites
        run: pip install playwright==1.65.1 && python -m playwright install --with-deps chromium
      - name: Close gone Best bets and New jobs (counts only; logs are public)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECON_PERSONAL_LISTS: ${{ vars.RECON_PERSONAL_LISTS }}
          CI: "true"
        run: python -m recon.linkcheck --recheck-open --best

  add:
    # jobs pasted into the dashboard's "Add job" box and "AI prep" requests: the dashboard starts lane "add" right away;
    # every 1-2 run also handles any still queued
    if: ${{ inputs.lane == 'add' || (inputs.lane == '1-2' && !inputs.recheck) }}
    concurrency:
      group: recon-add
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Browser for company pages
        if: inputs.lane == 'add'
        run: pip install playwright==1.65.1 && python -m playwright install --with-deps chromium
      - name: Add jobs (counts only; logs are public)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CI: "true"
        run: python -m recon.add
      - name: AI prep for applications (counts only)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CI: "true"
        run: python -m recon.prep

  judge:
    needs: [gate, tier-1-2]
    # still judge when the fetch failed (the queue is in the database); never on rechecks
    if: ${{ !cancelled() && inputs.lane == '1-2' && !inputs.recheck && needs.gate.outputs.recheck_12 != 'true' }}
    concurrency:
      group: recon-judge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 40 jobs x 13s pacing is about 9 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: AI judge (counts only; logs are public)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
        run: python -m recon.judge
